<div class="player-box">
  <iframe id="player"
    src=""
    allowfullscreen>
  </iframe>
</div>

<div class="controls">
  <button id="prev" class="nav-btn">◀</button>

  <div id="cdArea"></div>

  <button id="next" class="nav-btn">▶</button>
</div>

<button id="clearBtn" class="clear-btn">
  전체 삭제
</button>

<button id="addBtn" class="add-btn">
  +
</button>

<div id="modal" class="modal">
  <div class="modal-content">
    <input
      id="titleInput"
      placeholder="이름 입력">

    <input
      id="urlInput"
      placeholder="유튜브 링크 입력">

    <button id="saveBtn">
      추가
    </button>
  </div>
</div>
